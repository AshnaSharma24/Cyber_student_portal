{% extends "base.html" %}
{% block content %}
<section class="panel">
  <h1>Login</h1>

  <form method="post" autocomplete="off">
    <label>
      Username
      <input type="text" name="username" required autocomplete="off" placeholder="username">
    </label>
    <label>
      Password
      <input type="password" name="password" required autocomplete="off" placeholder="Password">
    </label>
    <button type="submit">Sign In</button>
  </form>

  {% if message %}
    <div class="error">{{ message }}</div>
  {% endif %}
  {% if lock_seconds %}
    <script>
      // Alert the user when their account is locked due to repeated failures
      alert('Account locked due to multiple failed attempts. Try again in {{ lock_seconds }} seconds.');
    </script>
  {% endif %}
  <script>
    // Clear any autofilled values on page load to avoid exposing credentials via back-button cached form
    document.addEventListener('DOMContentLoaded', function () {
      try {
        var f = document.querySelector('form');
        if (f) {
          // Reset the form to clear values (works even if browser autofill filled them)
          f.reset();
          // Explicitly clear password field after a short delay
          setTimeout(function () {
            var p = document.querySelector('input[type="password"]');
            if (p) p.value = '';
          }, 50);
        }
      } catch (e) {
        // no-op
      }
    });
  </script>
</section>
{% endblock %}
