<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>{{ title or "Secure Student Portal" }}</title>
  <!-- Bootstrap for a clean, responsive UI -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUa6zY2QK6v7m4b1bE2b1kqQ1Q6f5c5b6b8b9b0" crossorigin="anonymous">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="{{ url_for('dashboard') }}">Secure Student Portal</a>
      <nav class="nav">
        <a href="{{ url_for('login') }}">Vulnerable Login</a>
        <a href="{{ url_for('secure_login') }}">Secure Login</a>
        <a href="{{ url_for('search') }}">Vulnerable Search</a>
        <a href="{{ url_for('secure_search') }}">Secure Search</a>
        <a href="{{ url_for('admin') }}">Admin</a>
        <a href="{{ url_for('logout') }}">Logout</a>
      </nav>
    </header>
    {% block content %}{% endblock %}
  </main>
  <script>
    // Prevent Chrome from showing cached protected pages when using back/forward (bfcache)
    window.addEventListener('pageshow', function (event) {
      try {
        var navType = '';
        if (performance && performance.getEntriesByType) {
          var entries = performance.getEntriesByType('navigation');
          if (entries && entries.length) navType = entries[0].type;
        } else if (performance && performance.navigation) {
          // fallback for older browsers
          if (performance.navigation.type === 2) navType = 'back_forward';
        }

        if (event.persisted || navType === 'back_forward') {
          // Force a reload so the server can revalidate the session
          window.location.reload();
        }
      } catch (e) {
        // noop
      }
    });
  </script>
</body>
</html>
